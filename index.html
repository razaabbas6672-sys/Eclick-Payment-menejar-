<body>

<div class="container">
    <header>
        <h1>E click payment ledger</h1>
        <p>Managed by Raza</p>
    </header>

    <div class="summary-card">
        <div class="summary-box">
            <span>Total Billed</span>
            <strong id="totalBilled">₹0</strong>
        </div>
        <div class="summary-box">
            <span>Received</span>
            <strong id="totalReceived" class="paid">₹0</strong>
        </div>
        <div class="summary-box">
            <span>Pending</span>
            <strong id="totalPending" class="pending">₹0</strong>
        </div>
    </div>

    <div class="form-section">
        <div class="form-group">
            <label>Client / Store Name</label>
            <input type="text" id="clientName" placeholder="e.g. Amazon Seller Store">
        </div>
        <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="amount" placeholder="e.g. 5000">
        </div>
        <div class="form-group">
            <label>Payment Status</label>
            <select id="status">
                <option value="Paid">Received / Paid</option>
                <option value="Pending">Pending</option>
            </select>
        </div>
        <button class="btn-add" onclick="addRecord()">Add Entry</button>
    </div>

    <div class="records-section">
        <div class="records-title">
            <span>Entries</span>
            <span style="font-size: 0.75rem; color: #64748b;" id="recordCount">0 items</span>
        </div>
        <div id="recordsList"></div>
    </div>
</div>

<script>
    let ledgerData = JSON.parse(localStorage.getItem('eclick_ledger')) || [];

    function updateView() {
        const list = document.getElementById('recordsList');
        list.innerHTML = '';
        let billed = 0, received = 0, pending = 0;

        ledgerData.forEach((item, index) => {
            billed += Number(item.amount);
            if (item.status === 'Paid') received += Number(item.amount);
            if (item.status === 'Pending') pending += Number(item.amount);

            const div = document.createElement('div');
            div.className = 'record-card';
            div.innerHTML = `
                <div class="record-info">
                    <h4>${item.client}</h4>
                    <p>${item.date}</p>
                </div>
                <div style="display: flex; align-items: center;">
                    <div class="record-amount">
                        <div class="amount ${item.status === 'Paid' ? 'paid' : 'pending'}">₹${item.amount}</div>
                        <div style="font-size: 0.7rem; color: #64748b;">${item.status}</div>
                    </div>
                    <button class="btn-del" onclick="deleteRecord(${index})">&times;</button>
                </div>
            `;
            list.appendChild(div);
        });

        document.getElementById('totalBilled').innerText = '₹' + billed;
        document.getElementById('totalReceived').innerText = '₹' + received;
        document.getElementById('totalPending').innerText = '₹' + pending;
        document.getElementById('recordCount').innerText = ledgerData.length + ' items';
        localStorage.setItem('eclick_ledger', JSON.stringify(ledgerData));
    }

    function addRecord() {
        const client = document.getElementById('clientName').value.trim();
        const amount = document.getElementById('amount').value.trim();
        const status = document.getElementById('status').value;

        if (!client || !amount) {
            alert('Kripya details bharein!');
            return;
        }

        const date = new Date().toLocaleDateString('en-GB');
        ledgerData.unshift({ client, amount, status, date });
        document.getElementById('clientName').value = '';
        document.getElementById('amount').value = '';
        updateView();
    }

    function deleteRecord(index) {
        ledgerData.splice(index, 1);
        updateView();
    }

    updateView();
</script>
</body>
</html>
